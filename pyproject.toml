[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "header-auditor"
version = "0.1.0"
description = "Auditor de cabeceras de seguridad HTTP"
readme = "README.md"
license = "MIT"
authors = [{ name = "GuilletDominguez" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
header-auditor = "header_auditor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
